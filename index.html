<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ЗИС Барахолка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy header band with search, category rail, filter sidebar + card grid; one-column on phones */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#13213b; --muted:#5b6880; --line:#dfe4ec;
  --head:#15295a; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.14);
  --accent:#f4b400; --accent-ink:#1a1400; --brand:#1f4fb3; --brand-soft:#e7eefc;
  --danger:#c23b2f; --ok:#1d8a4e; --shadow:0 1px 2px rgba(19,33,59,.06),0 6px 18px rgba(19,33,59,.07);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131e; --surface:#151d2b; --ink:#e7ecf5; --muted:#95a2b8; --line:#253145;
  --head:#0a1530; --head-ink:#f1f4fb; --head-soft:rgba(255,255,255,.1);
  --accent:#f6c233; --accent-ink:#1a1400; --brand:#86a8f0; --brand-soft:#1c2a47;
  --danger:#ef6b5f; --ok:#4cc184; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131e; --surface:#151d2b; --ink:#e7ecf5; --muted:#95a2b8; --line:#253145;
  --head:#0a1530; --head-ink:#f1f4fb; --head-soft:rgba(255,255,255,.1);
  --accent:#f6c233; --accent-ink:#1a1400; --brand:#86a8f0; --brand-soft:#1c2a47;
  --danger:#ef6b5f; --ok:#4cc184; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hrow{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.02em}
.logo-txt{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1;letter-spacing:.01em}
.logo-txt small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;opacity:.7;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.search{flex:1 1 360px;display:flex;min-width:0;background:var(--surface);border-radius:10px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;padding:11px 14px;background:transparent;color:var(--ink);outline:none}
.search select{border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);padding:0 10px;max-width:42%;outline:none}
.search button{border:0;background:var(--accent);color:var(--accent-ink);padding:0 18px;font-weight:700}
.hnav{display:flex;gap:6px;align-items:center;flex:none}
.hbtn{border:0;background:var(--head-soft);color:var(--head-ink);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;text-decoration:none}
.hbtn svg{width:18px;height:18px}
.post-btn{background:var(--accent);color:var(--accent-ink);font-weight:700}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}

/* categories */
.cats{background:var(--surface);border-bottom:1px solid var(--line)}
.cat-scroll{overflow-x:auto;scrollbar-width:thin}
.cat-row{display:flex;gap:4px;padding-block:10px;width:max-content}
.cat{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;width:96px;font-size:12px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2}
.cat .ic{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.cat .ic svg{width:24px;height:24px}
.cat .n{font-weight:500;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.cat:hover .ic{transform:translateY(-1px)}
.cat[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}

/* main */
main{padding-block:20px 48px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;outline:none;min-width:0}
.inp:focus{border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;text-align:left}
.toolbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolbar h1{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.toolbar .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow)}
.ph{aspect-ratio:4/3;background:var(--brand-soft);position:relative;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .noph{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand);opacity:.5}
.ph .noph svg{width:40px;height:40px}
.ph .np{position:absolute;right:8px;bottom:8px;background:rgba(10,18,35,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#13213b;display:grid;place-items:center}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:#d63a4a}
.fav[aria-pressed="true"] svg{fill:currentColor}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.price.free{color:var(--ok)}
.ctitle{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.meta{font-size:12px;color:var(--muted);margin-top:auto;display:flex;justify-content:space-between;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--brand-soft);color:var(--brand)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;font-weight:600}

/* form */
.form{max-width:760px;display:flex;flex-direction:column;gap:16px}
.form .panel{gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pic{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--brand-soft)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(10,18,35,.7);color:#fff;font-size:14px;line-height:1}
.addpic{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:6px}
textarea.inp{min-height:130px;resize:vertical}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,12,24,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden;position:relative}
.gal{background:#0b1220;display:flex;flex-direction:column;align-self:start;border-radius:0 0 16px 0}
.gal .main{aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.gal .main img{max-width:100%;max-height:100%;object-fit:contain}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.thumbs button{flex:none;width:64px;height:48px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:#1b2436}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.info h2{margin:0;font-size:20px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.info .price{font-size:26px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.seller{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.phone{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;user-select:all}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#13213b;font-size:20px;z-index:2}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag.sold{background:var(--ink);color:var(--surface)}
.card.is-sold .ph{opacity:.55}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg2{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:7px 11px;font-size:16px;line-height:1;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.grid.list{grid-template-columns:minmax(0,1fr)}
.grid.list .card{flex-direction:row}
.grid.list .ph{width:220px;flex:none;aspect-ratio:4/3}
.grid.list .ctitle{-webkit-line-clamp:3;font-size:15px}
.sub{margin:0 0 10px;font-size:15px;font-weight:700}
.recent{margin-bottom:24px}
.recent .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.recent .ctitle{font-size:13px}
.sellerbar{display:flex;gap:12px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
.sslist{display:flex;flex-direction:column}
.ssrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ssrow:last-child{border-bottom:0}
.danger-link{color:var(--danger);font-size:13px}
.link:disabled{color:var(--muted);cursor:default}
.qa{border-top:1px solid var(--line);padding-top:12px}
.q{padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.qt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ans{margin-left:14px;padding:6px 10px;background:var(--brand-soft);border-radius:8px}
.qaform{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qaform .inp{flex:1 1 160px}
.simgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.simgrid .ctitle{font-size:13px}.simgrid .price{font-size:15px}.simgrid .fav{display:none}
.filters-toggle{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .filters-toggle{display:inline-flex}
  aside.panel{display:none} aside.panel.open{display:flex}
  .sheet{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .hbtn .lbl{display:none}
  .logo-txt small{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid.list .ph{width:120px}
  .search select{display:none}
  .toolbar h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const REGIONS = {
  "Минск":["Минск"],
  "Брестская обл.":["Брест","Барановичи","Пинск","Кобрин","Берёза","Лунинец","Ивацевичи","Пружаны"],
  "Витебская обл.":["Витебск","Орша","Новополоцк","Полоцк","Поставы","Глубокое","Лепель"],
  "Гомельская обл.":["Гомель","Мозырь","Жлобин","Светлогорск","Речица","Калинковичи","Рогачёв","Добруш","Хойники"],
  "Гродненская обл.":["Гродно","Лида","Слоним","Волковыск","Сморгонь","Новогрудок","Щучин"],
  "Минская обл.":["Борисов","Солигорск","Молодечно","Жодино","Слуцк","Дзержинск","Марьина Горка","Заславль","Фаниполь"],
  "Могилёвская обл.":["Могилёв","Бобруйск","Горки","Кричев","Осиповичи","Шклов","Быхов"]
};
const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const CATS = [
  {id:"realty",name:"Недвижимость",ic:I('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>')},
  {id:"auto",name:"Авто и транспорт",ic:I('<path d="M5 16l1.5-5h11L19 16"/><rect x="3" y="16" width="18" height="3" rx="1"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>')},
  {id:"electronics",name:"Электроника",ic:I('<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>')},
  {id:"computers",name:"Компьютеры",ic:I('<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>')},
  {id:"home",name:"Дом и сад",ic:I('<path d="M4 14h16v4H4z"/><path d="M6 14V9a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v5"/><path d="M5 18v2M19 18v2"/>')},
  {id:"repair",name:"Ремонт и стройка",ic:I('<path d="M14 6l4 4-9 9H5v-4z"/><path d="M13 7l4 4"/>')},
  {id:"clothes",name:"Одежда и обувь",ic:I('<path d="M8 3l4 2 4-2 4 4-3 3v11H7V10L4 7z"/>')},
  {id:"kids",name:"Детские товары",ic:I('<circle cx="9" cy="19" r="2"/><circle cx="17" cy="19" r="2"/><path d="M3 5h2l2 9h11l2-6H7"/>')},
  {id:"hobby",name:"Хобби и спорт",ic:I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>')},
  {id:"animals",name:"Животные",ic:I('<circle cx="7" cy="9" r="2"/><circle cx="17" cy="9" r="2"/><circle cx="10" cy="5" r="1.6"/><circle cx="14" cy="5" r="1.6"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5-2 3-4 2-4 1-4-2z"/>')},
  {id:"beauty",name:"Красота и здоровье",ic:I('<path d="M9 3h6v4H9z"/><path d="M8 7h8v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z"/>')},
  {id:"jobs",name:"Работа",ic:I('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/>')},
  {id:"services",name:"Услуги",ic:I('<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>')},
  {id:"free",name:"Отдам даром",ic:I('<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12M12 9c-2-4-6-4-6-1s6 1 6 1 6 2 6-1-4-3-6 1"/>')}

function fmtDate(t){
  if(!t) return ""; const d=new Date(t), n=new Date();
  const hm=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=(day(n)-day(d))/864e5;
  if(diff===0) return "Сегодня, "+hm; if(diff===1) return "Вчера, "+hm;
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"});
}

const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadImg(e.target)}}),{rootMargin:"300px"}) : null;
function loadImg(img){getPic(img.dataset.o,img.dataset.p).then(src=>{if(src){img.src=src;img.hidden=false;const n=img.parentElement.querySelector(".noph");if(n)n.hidden=true}})}
function hookImgs(root){root.querySelectorAll("img[data-p]").forEach(img=>io?io.observe(img):loadImg(img))}
function compress(file,max,limit){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{
      let q=.82, m=max, out="";
      for(let i=0;i<7;i++){
        const sc=Math.min(1,m/Math.max(im.width,im.height));
        const c=document.createElement("canvas"); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q);
        if(out.length<limit) break; q=Math.max(.5,q-.08); m=Math.round(m*.85);
      }
      URL.revokeObjectURL(url); res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};
    im.src=url;
  });
}

function writeErr(e){

  if(e&&e.code==="resource_exhausted") return "Слишком много действий подряд. Подождите минуту.";
  return "Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.";
}

/* ---------- filtering ---------- */
function filtered(list){
  const q=S.q.trim().toLowerCase();
  let r=list.filter(a=>{
    if(a.sold) return false;
    if(S.seller&&a.uid!==S.seller) return false;
    if(S.cat&&a.cat!==S.cat) return false;
    if(S.region&&a.region!==S.region) return false;
    if(S.city&&a.city!==S.city) return false;
    if(S.cond&&a.cond!==S.cond) return false;
    if(S.photo&&!(a.pics&&a.pics.length)) return false;
    const p=a.priceType==="fixed"?Number(a.price):null;
    if(S.min!==""&&(p==null||p<Number(S.min))) return false;
    if(S.max!==""&&(p==null||p>Number(S.max))) return false;
    if(q&&!((a.title||"")+" "+(a.desc||"")).toLowerCase().includes(q)) return false;
    return true;
  });
  const pv=a=>a.priceType==="fixed"?Number(a.price):(a.priceType==="free"?0:Infinity);
  if(S.sort==="new") r.sort((a,b)=>bumpAt(b)-bumpAt(a));
  if(S.sort==="views") r.sort((a,b)=>(viewCounts[key(b)]||0)-(viewCounts[key(a)]||0));
  if(S.sort==="cheap") r.sort((a,b)=>pv(a)-pv(b));
  if(S.sort==="dear") r.sort((a,b)=>{const x=pv(a),y=pv(b);return (y===Infinity?-1:y)-(x===Infinity?-1:x)});
  return r;
}

/* ---------- local demo store (used only outside claude.ai, e.g. GitHub Pages) ---------- */
function localDB(){
  let store={}; try{store=JSON.parse(localStorage.getItem("zis-db")||"{}")}catch(_){}
  const subs=new Set();
  const save=()=>{try{localStorage.setItem("zis-db",JSON.stringify(store))}catch(_){throw {code:"quota_exceeded"}}subs.forEach(f=>f())};
  const snapOf=(p)=>({id:p.split("/").pop(),exists:p in store,data:()=>store[p]});
  const doc=p=>({id:p.split("/").pop(),path:p,
    get:async()=>snapOf(p),
    set:async d=>{const old=store[p];store[p]=JSON.parse(JSON.stringify(d));try{save()}catch(e){if(old===undefined)delete store[p];else store[p]=old;throw e}},
    delete:async()=>{delete store[p];save()},
    onSnapshot(next){const f=()=>next(snapOf(p));subs.add(f);f();return()=>subs.delete(f)}});
  const coll=c=>{const q={path:c,doc:id=>doc(c+"/"+(id||rid())),limit:()=>q,
    onSnapshot(next){const f=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(c+"/")&&!k.slice(c.length+1).includes("/")).map(snapOf);next({docs,size:docs.length,empty:!docs.length})};subs.add(f);f();return()=>subs.delete(f)}};return q};
  return {doc,collection:coll};
}

    db=localDB(); uid="local"; canWrite=true; owner=true; demo=true;
    const b=document.createElement("div"); b.className="wrap note"; b.style.paddingBlock="8px";
    b.textContent="Демо-режим: объявления сохраняются только в этом браузере. Общая база работает в версии на claude.ai.";
    document.querySelector(".cats").after(b);
  }
  try{ if(!db) db = window.claude ? await window.claude.use("db") : null; }catch(_){db=null}
  if(!db){clearTimeout(timer);loadErr="Войдите в аккаунт Claude, чтобы смотреть и подавать объявления.";render();return}
  if(window.claude){ try{ user = await window.claude.use("user"); }catch(_){user=null} }
  if(user){ try{uid=await user.id()}catch(_){} try{canWrite=await user.can("data.write")}catch(_){} try{owner=await user.isOwner()}catch(_){} }
  db.collection("ads").limit(1000).onSnapshot(snap=>{
    clearTimeout(timer); loadErr="";
    const list=[]; let mine={};
    snap.docs.forEach(d=>{const items=(d.data()||{}).items||{};for(const k in items){const it=items[k];if(it&&it.title)list.push({...it,id:k,uid:d.id})}if(d.id===uid)mine={...items}});
    ads=list; myItems=mine; loaded=true; render();
  },err=>{clearTimeout(timer);loadErr="Не удалось загрузить объявления. Обновите страницу чуть позже.";render()});
  if(uid) db.collection("data/users/"+uid).doc("favs").onSnapshot(s=>{const d=s.data()||{};favs=new Set(d.ids||[]);searches=Array.isArray(d.searches)?d.searches:[];syncFavUI();if(location.hash==="#favs")route()},()=>{});
  db.collection("views").limit(1000).onSnapshot(snap=>{
    const c={}; snap.docs.forEach(d=>{const ids=(d.data()||{}).ids||[];ids.forEach(k=>c[k]=(c[k]||0)+1);if(d.id===uid)myViews=ids.slice()});
    viewCounts=c;
  },()=>{});
  db.collection("qa").limit(1000).onSnapshot(snap=>{
    const list=[]; snap.docs.forEach(d=>{const items=(d.data()||{}).items||{};for(const k in items)list.push({...items[k],id:k,uid:d.id});if(d.id===uid)myQa={...items}});
    qa=list; if(openKey) renderQa(openKey);
  },()=>{});
  if(owner) db.collection("reports").limit(1000).onSnapshot(snap=>{
    const list=[]; snap.docs.forEach(d=>{const items=(d.data()||{}).items||{};for(const k in items)list.push({...items[k],id:k,uid:d.id})});
    reports=list; const b=$("#repLink"); if(b){b.hidden=false;b.querySelector(".badge").textContent=list.length} if(location.hash==="#reports")route();
  },()=>{});
  if(uid) db.collection("reports").doc(uid).onSnapshot(s=>{myReports={...((s.data()||{}).items||{})}},()=>{});
  if(location.hash.startsWith("#ad-")) route();
})();
</script>
</body></html>
