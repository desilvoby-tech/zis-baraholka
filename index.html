<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: navy header band with search, category rail, filter sidebar + card grid; one-column on phones */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#13213b; --muted:#5b6880; --line:#dfe4ec;
  --head:#15295a; --head-ink:#ffffff; --head-soft:rgba(255,255,255,.14);
  --accent:#00B4EE; --accent-ink:#ffffff; --brand:#1f4fb3; --brand-soft:#e7eefc;
  --danger:#c23b2f; --ok:#1d8a4e; --shadow:0 1px 2px rgba(19,33,59,.06),0 6px 18px rgba(19,33,59,.07);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131e; --surface:#151d2b; --ink:#e7ecf5; --muted:#95a2b8; --line:#253145;
  --head:#0a1530; --head-ink:#f1f4fb; --head-soft:rgba(255,255,255,.1);
  --accent:#00B4EE; --accent-ink:#ffffff; --brand:#86a8f0; --brand-soft:#1c2a47;
  --danger:#ef6b5f; --ok:#4cc184; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131e; --surface:#151d2b; --ink:#e7ecf5; --muted:#95a2b8; --line:#253145;
  --head:#0a1530; --head-ink:#f1f4fb; --head-soft:rgba(255,255,255,.1);
  --accent:#00B4EE; --accent-ink:#ffffff; --brand:#86a8f0; --brand-soft:#1c2a47;
  --danger:#ef6b5f; --ok:#4cc184; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hrow{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.02em}
.logo-txt{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1;letter-spacing:.01em}
.logo-txt small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;opacity:.7;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.search{flex:1 1 360px;display:flex;min-width:0;background:var(--surface);border-radius:10px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;padding:11px 14px;background:transparent;color:var(--ink);outline:none}
.search select{border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);padding:0 10px;max-width:42%;outline:none}
.search button{border:0;background:var(--accent);color:var(--accent-ink);padding:0 18px;font-weight:700}
.hnav{display:flex;gap:6px;align-items:center;flex:none}
.hbtn{border:0;background:var(--head-soft);color:var(--head-ink);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;text-decoration:none}
.hbtn svg{width:18px;height:18px}
.post-btn{background:var(--accent);color:var(--accent-ink);font-weight:700}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}

/* categories */
.cats{background:var(--surface);border-bottom:1px solid var(--line)}
.cat-scroll{overflow-x:auto;scrollbar-width:thin}
.cat-row{display:flex;gap:4px;padding-block:10px;width:max-content}
.cat{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;width:96px;font-size:12px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2}
.cat .ic{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.cat .ic svg{width:24px;height:24px}
.cat .n{font-weight:500;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.cat:hover .ic{transform:translateY(-1px)}
.cat[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}

/* main */
main{padding-block:20px 48px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;outline:none;min-width:0}
.inp:focus{border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;text-align:left}
.toolbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolbar h1{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.toolbar .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{color:inherit;text-decoration:none;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow)}
.ph{aspect-ratio:4/3;background:var(--brand-soft);position:relative;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .noph{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand);opacity:.5}
.ph .noph svg{width:40px;height:40px}
.ph .np{position:absolute;right:8px;bottom:8px;background:rgba(10,18,35,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#13213b;display:grid;place-items:center}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:#d63a4a}
.fav[aria-pressed="true"] svg{fill:currentColor}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.price.free{color:var(--ok)}
.ctitle{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.meta{font-size:12px;color:var(--muted);margin-top:auto;display:flex;justify-content:space-between;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--brand-soft);color:var(--brand)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.btn{text-decoration:none;border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;font-weight:600}

/* form */
.form{max-width:760px;display:flex;flex-direction:column;gap:16px}
.form .panel{gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pic{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--brand-soft)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(10,18,35,.7);color:#fff;font-size:14px;line-height:1}
.addpic{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:6px}
textarea.inp{min-height:130px;resize:vertical}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,12,24,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden;position:relative}
.gal{background:#0b1220;display:flex;flex-direction:column;align-self:start;border-radius:0 0 16px 0}
.gal .main{aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.gal .main img{max-width:100%;max-height:100%;object-fit:contain}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.thumbs button{flex:none;width:64px;height:48px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:#1b2436}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.info h2{margin:0;font-size:20px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.info .price{font-size:26px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.seller{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.phone{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;user-select:all}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#13213b;font-size:20px;z-index:2}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag.sold{background:var(--ink);color:var(--surface)}
.card.is-sold .ph{opacity:.55}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg2{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:7px 11px;font-size:16px;line-height:1;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.grid.list{grid-template-columns:minmax(0,1fr)}
.grid.list .card{flex-direction:row}
.grid.list .ph{width:220px;flex:none;aspect-ratio:4/3}
.grid.list .ctitle{-webkit-line-clamp:3;font-size:15px}
.sub{margin:0 0 10px;font-size:15px;font-weight:700}
.recent{margin-bottom:24px}
.recent .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.recent .ctitle{font-size:13px}
.sellerbar{display:flex;gap:12px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
.sslist{display:flex;flex-direction:column}
.ssrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ssrow:last-child{border-bottom:0}
.danger-link{color:var(--danger);font-size:13px}
.link:disabled{color:var(--muted);cursor:default}
.qa{border-top:1px solid var(--line);padding-top:12px}
.q{padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.qt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ans{margin-left:14px;padding:6px 10px;background:var(--brand-soft);border-radius:8px}
.qaform{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qaform .inp{flex:1 1 160px}
.simgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.simgrid .ctitle{font-size:13px}.simgrid .price{font-size:15px}.simgrid .fav{display:none}
.filters-toggle{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .filters-toggle{display:inline-flex}
  aside.panel{display:none} aside.panel.open{display:flex}
  .sheet{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .hbtn .lbl{display:none}
  .logo-txt small{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid.list .ph{width:120px}
  .search select{display:none}
  .toolbar h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- full site additions ---- */
.hbtn{position:relative}
.hbtn .dot{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--brand-soft);color:var(--brand);display:inline-grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avatar.lg{width:72px;height:72px;font-size:26px}
.avatar.sm{width:28px;height:28px;font-size:12px}
.avatar img{width:100%;height:100%;object-fit:cover}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.page{max-width:980px}
.narrow{max-width:520px;margin-inline:auto}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.crumbs a{color:var(--brand);text-decoration:none}
.adpage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.adpage .gal{border-radius:14px;overflow:hidden;align-self:stretch}
.adside{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h1{margin:0;font-size:22px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.box .price{font-size:28px}
.sellercard{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.sellercard .nm{font-weight:700}
.sub2{margin:0;font-size:16px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.more{display:flex;justify-content:center;margin-top:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
/* chat */
.convs{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.conv{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.conv:last-child{border-bottom:0}
.conv:hover{background:var(--bg)}
.conv .cmain{min-width:0;flex:1}
.conv .ct{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .cl{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .cthumb{width:52px;height:40px;border-radius:8px;object-fit:cover;background:var(--brand-soft);flex:none}
.conv .unread{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:12px;font-weight:800;padding:1px 8px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:min(72vh,720px);min-height:380px}
.chathead{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chathead a{color:inherit}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--brand-soft)}
.msg time{display:block;font-size:11px;color:var(--muted);margin-top:2px;text-align:right}
.chatform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatform textarea{flex:1;min-height:42px;max-height:140px;resize:none}
.review{border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:4px}
.review:last-child{border-bottom:0}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:26px;line-height:1;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--accent)}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.attrs div{background:var(--bg);border-radius:10px;padding:8px 10px}
.attrs dt{font-size:12px;color:var(--muted)} .attrs dd{margin:0;font-weight:700}
.setup{max-width:640px;margin:40px auto}
.setup code{background:var(--bg);padding:2px 6px;border-radius:6px}
.bottomnav{display:none}
.userhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
@media (max-width:860px){
  .adpage{grid-template-columns:minmax(0,1fr)}
  .adside{position:static}
}
@media (max-width:640px){
  .hnav{display:none}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

function fmtPrice(a){
  if(a.price_type==="free"||a.cat==="free") return '<span class="price free">Бесплатно</span>';
  if(a.price_type==="deal"||a.price==null) return '<span class="price">Договорная</span>';
  const usdFixed=a.currency==="USD"&&a.price_usd!=null;
  const byn=usdFixed&&USD_RATE?Math.round(a.price_usd*USD_RATE):Number(a.price);
  const usd=usdFixed?Number(a.price_usd):(USD_RATE?Math.round(Number(a.price)/USD_RATE):null);
  return `<span class="price">${byn.toLocaleString("ru-RU")}${BYN}</span>`;
}
function fmtDate(t){
  if(!t) return ""; const d=new Date(t), n=new Date();
  const hm=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((day(n)-day(d))/864e5);
  if(diff===0) return "Сегодня, "+hm; if(diff===1) return "Вчера, "+hm;
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"});
}

function compressToBlob(file,max,quality){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("Не удалось обработать фото")),"image/jpeg",quality)};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Файл не похож на фото"))};
    im.src=url;
  });
}

let leafletP=null, mapObj=null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  return leafletP||(leafletP=new Promise((ok,no)=>{
    const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
    const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; sc.onload=ok; sc.onerror=()=>{leafletP=null;no()}; document.head.appendChild(sc);
  }));
}
const geoCache=lsGet("zis-geo",{});
let geoLast=0;
async function geoCity(city){
  if(geoCache[city]) return geoCache[city];
  const wait=Math.max(0,geoLast+1100-Date.now()); geoLast=Date.now()+wait; if(wait) await new Promise(r=>setTimeout(r,wait));
  try{
    const r=await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=by&accept-language=ru&q="+encodeURIComponent(city+", Беларусь"))).json();
    if(r[0]){geoCache[city]=[+r[0].lat,+r[0].lon]; lsSet("zis-geo",geoCache); return geoCache[city]}
  }catch(_){}
  return null;
}
async function paintMap(box){
  box.innerHTML=`<div id="adMap" class="admap"></div><p class="note" id="mapNote">Загружаем карту…</p>`;
  try{await loadLeaflet()}catch(_){box.innerHTML=emptyBlock("Карта недоступна","Проверьте соединение и попробуйте ещё раз.");return}
  if(!$("#adMap")) return;
  if(mapObj){try{mapObj.remove()}catch(_){}}
  const m=mapObj=L.map("adMap").setView([53.7,27.9],6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(m);
  const by={}; homeItems.forEach(a=>(by[a.city]=by[a.city]||[]).push(a));
  const cities=Object.keys(by), pts=[]; let done=0;
  for(const c of cities){
    const ll=await geoCity(c); if(mapObj!==m) return;
    done++; const nt=$("#mapNote"); if(nt) nt.textContent=done<cities.length?`Ставим точки: ${done} из ${cities.length}…`:`Показано ${homeItems.length} из ${homeTotal} объявлений. Города без точки на карте не показаны.`;
    if(!ll) continue; pts.push(ll);
    const list=by[c].slice(0,6).map(a=>`<a href="#ad/${a.id}">${esc(a.title)}</a> — ${a.price_type==="fixed"&&a.price!=null?esc(String(a.price))+" р.":a.price_type==="free"?"даром":"договорная"}`).join("<br>");
    L.marker(ll).addTo(m).bindPopup(`<b>${esc(c)}</b> · ${by[c].length}<br>${list}`);
    if(pts.length>1) m.fitBounds(pts,{padding:[30,30],maxZoom:10});
  }
}

let loginEmail="";

function authErr(e){const m=(e&&(e.message||e.code))||"";
  if(/Invalid login credentials/i.test(m))return "Неверная почта или пароль.";
  if(/already registered|already exists/i.test(m))return "Эта почта уже зарегистрирована. Перейдите на вкладку «Вход».";
  if(/at least 6|Password should|weak/i.test(m))return "Пароль должен быть не короче 6 символов.";
  if(/Email not confirmed/i.test(m))return "Почта не подтверждена. Откройте ссылку из письма или войдите по ссылке на почту.";
  if(/rate limit|over_email/i.test(m))return "Сайт сейчас не может отправить письмо: слишком много писем за час. Войдите по паролю или попробуйте позже.";
  if(/valid email|invalid format|Unable to validate email/i.test(m))return "Проверьте адрес почты.";
  return errText(e)}
let tgTimer=null;
function oauthGo(p){location.href=CFG.url+"/functions/v1/oauth?p="+p+"&to="+encodeURIComponent(location.origin+"/")}

async function tgLogin(){
  const m=$("#tgMsg"), b=$("#tgLogin"); if(!m) return; clearTimeout(tgTimer);
  m.hidden=false; m.className="note"; m.textContent="Готовим вход…"; b.disabled=true;
  const fn=CFG.url+"/functions/v1/tg", hdr={"Content-Type":"application/json",apikey:CFG.anonKey};
  let r={}; try{r=await (await fetch(fn,{method:"POST",headers:hdr,body:JSON.stringify({action:"login_start"})})).json()}catch(_){}
  b.disabled=false;
  if(!r.code){m.className="err";m.textContent="Вход через Telegram пока недоступен. Войдите по почте.";return}
  m.innerHTML=`<a class="btn tg-btn" target="_blank" rel="noopener" href="${esc(r.link)}">Открыть Telegram</a><span>Нажмите «Старт» в боте — вход произойдёт автоматически.</span>`;
  const t0=Date.now();
  const tick=async()=>{
    if(!$("#tgMsg")) return;
    if(Date.now()-t0>5*60e3){m.className="err";m.textContent="Время вышло. Нажмите «Войти через Telegram» ещё раз.";return}
    try{const st=await (await fetch(fn,{method:"POST",headers:hdr,body:JSON.stringify({action:"login_check",code:r.code})})).json();
      if(st.token_hash){m.textContent="Входим…";const {error}=await sb.auth.verifyOtp({token_hash:st.token_hash,type:"magiclink"});
        if(error){m.className="err";m.textContent="Ошибка входа: "+authErr(error);return}
        toast("Вы вошли через Telegram");return}
      if(st.status==="expired"||st.status==="error"){m.className="err";m.textContent="Не удалось войти. Попробуйте ещё раз.";return}
    }catch(_){}
    tgTimer=setTimeout(tick,2500)};
  tgTimer=setTimeout(tick,2500);
}

async function renderAdmin(){
  if(!isAdmin){view().innerHTML=emptyBlock("Раздел для модераторов");return}
  view().innerHTML=`<div class="page"><div class="toolbar"><h1>Заявки на продвижение</h1></div><div id="promoList">${loadingBlock()}</div><div class="toolbar"><h1>Жалобы</h1></div><div id="repList">${loadingBlock()}</div></div>`;
  sb.from("promo_orders").select("*, ads(id,title)").eq("status","pending").order("created_at",{ascending:false}).then(({data:po,error:pe})=>{const b=$("#promoList");if(!b)return;if(pe){b.innerHTML=emptyBlock("Ошибка",esc(errText(pe)));return}
    b.innerHTML=po.length?`<div class="panel">${po.map(o=>`<div class="ssrow"><div style="min-width:0"><strong>${esc((PROMO_TARIFFS.find(x=>x[0]===o.kind)||[,o.kind])[1])} — ${o.price} руб.</strong><div class="note">№${o.id} · ${o.ads?`<a class="link" href="#ad/${o.ads.id}">${esc(o.ads.title)}</a>`:"объявление удалено"} · ${esc(fmtDate(o.created_at))}</div></div><div class="actions"><button class="btn" data-poact="${o.id}">Оплачено — включить</button><button class="btn sec" data-pocancel="${o.id}">Отменить</button></div></div>`).join("")}</div>`:emptyBlock("Новых заявок нет","Когда продавец выберет тариф продвижения, заявка появится здесь.")});
  const {data,error}=await sb.from("reports").select("*, ads(id,title,user_id,photos)").order("created_at",{ascending:false});
  if(error){$("#repList").innerHTML=emptyBlock("Ошибка",esc(errText(error)));return}
  $("#repList").innerHTML=data.length?`<div class="panel">${data.map(r=>`<div class="ssrow"><div style="min-width:0"><strong>${esc(r.reason)}</strong>${r.body?" — "+esc(r.body):""}<div class="note">${r.ads?`<a class="link" href="#ad/${r.ads.id}">${esc(r.ads.title)}</a>`:"Объявление уже удалено"} · ${esc(fmtDate(r.created_at))}</div></div><div class="actions">${r.ads?`<button class="btn danger" data-addel="${r.ads.id}">Удалить объявление</button>`:""}<button class="btn sec" data-repdel="${r.id}">Отклонить жалобу</button></div></div>`).join("")}</div>`:emptyBlock("Жалоб нет","Когда посетители пожалуются на объявление, жалоба появится здесь.");
  view().onclick=async e=>{
    const ad=e.target.closest("[data-addel]"); if(ad){const r=data.find(x=>x.ads&&x.ads.id==ad.dataset.addel);const {error}=await sb.from("ads").delete().eq("id",ad.dataset.addel);if(error)toast(errText(error));else{if(r)removePhotos(r.ads.photos||[]);toast("Объявление удалено");loadCatCounts();renderAdmin()}}
    const rp=e.target.closest("[data-repdel]"); if(rp){await sb.from("reports").delete().eq("id",rp.dataset.repdel);renderAdmin()}
    const pa=e.target.closest("[data-poact]"); if(pa){const {error}=await sb.rpc("promo_activate",{p_order:+pa.dataset.poact});toast(error?errText(error):"Продвижение включено");PROMO.at=0;renderAdmin()}
    const pc=e.target.closest("[data-pocancel]"); if(pc){const {error}=await sb.rpc("promo_cancel",{p_order:+pc.dataset.pocancel});toast(error?errText(error):"Заявка отменена");renderAdmin()}
  };
}

/* ================= МАРШРУТЫ ================= */
const currentView=()=>(location.hash.slice(1).split("/")[0])||"home";
const currentArg=()=>location.hash.slice(1).split("/")[1];
async function route(){
  const v=currentView(), arg=currentArg();
  view().onclick=null; view().onsubmit=null; document.title=(unread?`(${unread}) `:"")+"Абисто";
  if(v!=="post"&&v!=="edit"&&draft&&!draft.id&&!draft.title) draft=null;
  if(user&&["my","profile","post","edit","admin","favs","msgs","chat","login"].includes(v)) await meReady;
  if(v!=="chat") chatConv=null;
  $("#catsBar").hidden=!["home"].includes(v);
  document.querySelectorAll("[data-nav]").forEach(a=>a.setAttribute("aria-current",a.dataset.nav===v||(v==="profile"&&a.dataset.nav==="my")?"page":"false"));
  window.scrollTo(0,0); document.body.classList.remove("has-adbar");
  try{
    if(v==="home") await renderHome();
    else if(v==="cats") renderAllCats();
    else if(v==="rules"||v==="privacy") renderLegal(v);
    else if(v==="ad") await renderAd(arg);
    else if(v==="post") await renderPost();
    else if(v==="edit") await renderPost(arg);
    else if(v==="my") await renderMy();
    else if(v==="profile") await renderProfile();
    else if(v==="favs") await renderFavs();
    else if(v==="msgs") await renderMsgs();
    else if(v==="chat") await renderChat(arg);
    else if(v==="user") await renderUser(arg);
    else if(v==="login") renderLogin();
    else if(v==="admin") await renderAdmin();
    else await renderHome();
  }catch(e){view().innerHTML=emptyBlock("Ошибка загрузки",esc(errText(e)),'<button class="btn sec" onclick="route()">Повторить</button>')}
  renderCats();
}

      btn.disabled=false;
      if(error){er.textContent=authErr(error);er.hidden=false;return}
      lastMagic=Date.now();$("#emailForm").hidden=true;$("#codeForm").hidden=false;$("#codeNote").innerHTML=`Мы отправили письмо на <strong>${esc(loginEmail)}</strong>. Откройте его <strong>в этом же браузере</strong> и нажмите ссылку для входа. Письмо может попасть в «Спам». Если в письме есть код из цифр, введите его ниже.`}
    if(id==="codeForm"){e.preventDefault();const er=$("#lErr");er.hidden=true;
      const {error}=await sb.auth.verifyOtp({email:loginEmail,token:$("#lCode").value.trim(),type:"email"});
      if(error){er.textContent=/expired|invalid/i.test(error.message)?"Код неверный или устарел. Запросите новый.":errText(error);er.hidden=false}}
    if(id==="profForm"){e.preventDefault();const er=$("#prErr");er.hidden=true;
      let site=$("#prSite").value.trim(); if(site&&!/^https?:\/\//i.test(site)) site="https://"+site;
      const upd={name:$("#prName").value.trim()||"Пользователь",phone:$("#prPhone").value.trim()||null,city:$("#prCity").value||null,
        is_business:$("#prBiz").checked,shop_name:$("#prShop").value.trim()||null,about:$("#prAbout").value.trim()||null,address:$("#prAddr").value.trim()||null,work_hours:$("#prHours").value.trim()||null,website:site||null};
      const {error}=await sb.from("profiles").update(upd).eq("id",user.id);
      if(error){er.textContent=errText(error);er.hidden=false;return}
      Object.assign(me,upd);profCache.set(user.id,me);paintMe();toast("Профиль сохранён");location.hash="#my"}
  });
  document.addEventListener("keydown",e=>{if(e.target.id==="chatText"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#chatForm").requestSubmit()}});
}
function paintMe(){
  $("#meLabel").textContent=user?(me&&me.name||"Кабинет"):"Войти";
  $("#meLink").href=user?"#my":"#login";
  $("#adminLink").hidden=!isAdmin;
}
let meReady=Promise.resolve();
async function onAuth(session,first){
  const prev=first?null:(user&&user.id); user=session?session.user:null;
  if(user){
    let {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
    if(!data){const r=await sb.from("profiles").insert({id:user.id,name:(user.email||"Пользователь").split("@")[0]}).select().single();data=r.data}
    me=data; if(me) profCache.set(me.id,me);
    const {data:adm}=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle(); isAdmin=!!adm;
  } else {me=null;isAdmin=false}
  paintMe();
  if(first){if(user){await loadFavs();syncFavButtons();refreshUnread();subscribeMessages()}return}
  if(prev!==(user&&user.id)){await loadFavs();refreshUnread();subscribeMessages();
    if(user&&currentView()==="login"&&!recoveryMode){const to=sessionStorage.getItem("zis-after-login")||"#my";sessionStorage.removeItem("zis-after-login");location.hash=to}
    else route();}
}

let USD_RATE=(lsGet("zis-usd",null)||{}).r||null;
fetch("https://api.nbrb.by/exrates/rates/431").then(r=>r.json()).then(j=>{if(j&&j.Cur_OfficialRate){const fresh=USD_RATE!==j.Cur_OfficialRate;USD_RATE=j.Cur_OfficialRate;lsSet("zis-usd",{r:USD_RATE});if(fresh&&sb&&!["post","edit","chat"].includes(currentView()))route()}}).catch(()=>{});
(async function start(){
  if(!window.supabase||!CFG.url||!CFG.anonKey||/ВСТАВЬТЕ|ВАШ_/.test(CFG.anonKey)){
    $("#catsBar").hidden=true;
    view().innerHTML=`<div class="setup box"><h1 style="font-size:22px">Сайт почти готов</h1>
      <p>Нужно подключить базу данных. Создайте в репозитории файл <code>config.js</code> с адресом проекта Supabase и публичным ключом (Publishable key из Settings → API Keys):</p>
      <pre style="background:var(--bg);padding:12px;border-radius:10px;overflow-x:auto">window.ZIS_CONFIG = {\n  url: "https://ВАШ-ПРОЕКТ.supabase.co",\n  anonKey: "ВАШ_PUBLISHABLE_КЛЮЧ",\n  google: false\n};</pre>
      ${!window.supabase?'<p class="err">Не загрузилась библиотека Supabase. Проверьте интернет и обновите страницу.</p>':""}</div>`;
    return;
  }
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
  {const h=location.hash,th=h.match(/oauth_th=([^&]+)/),oe=h.match(/oauth_err=([^&]+)/);
    if(th){history.replaceState(null,"",location.pathname+"#");sb.auth.verifyOtp({token_hash:decodeURIComponent(th[1]),type:"magiclink"}).then(({error})=>{if(error){authNotice="Ошибка входа: "+authErr(error);location.hash="#login"}else toast("Вы вошли")})}
    else if(oe){authNotice=decodeURIComponent(oe[1]);history.replaceState(null,"",location.pathname+"#login")}}
  {const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,""));const code=q.get("error_code")||h.get("error_code"),desc=q.get("error_description")||h.get("error_description");
    if(code||desc){authNotice=/expired|invalid/i.test((code||"")+(desc||""))?"Ссылка из письма устарела или уже использована. Каждое новое письмо отменяет ссылку из предыдущего, поэтому открывайте ссылку из последнего письма. Или войдите по паролю.":"Не удалось войти по ссылке: "+(desc||code);history.replaceState(null,"",location.pathname+"#login")}}
  {const fy=$("#footYear"); if(fy) fy.textContent=new Date().getFullYear();}
  document.body.insertAdjacentHTML("afterbegin",ART_DEFS);
  wire(); renderCats(); loadCatCounts();
  const {data:{session}}=await sb.auth.getSession();
  user=session?session.user:null;
  meReady=onAuth(session,true);
  route();
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="PASSWORD_RECOVERY"){recoveryMode=true;location.hash="#login";setTimeout(renderLogin,60)}if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="USER_UPDATED")setTimeout(()=>onAuth(s),0)});
})();
</script>
