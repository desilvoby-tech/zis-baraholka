name: SEO-страницы объявлений
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen-ob
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Сгенерировать страницы /ob/
        run: python3 tools/gen_ob.py
      - name: Сохранить изменения
        run: |
          git add -A ob sitemap-ob.xml
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git config user.name "abisto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Обновление страниц объявлений"
          git push
